<!DOCTYPE html>
<!-- SCR-03 — Danh muc phuong tien (CN-01-02) -->
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: main('Phương tiện', ~{::content})}">
<body>

<div th:fragment="content">

    <div class="toolbar d-flex justify-content-between align-items-end flex-wrap gap-2">

        <form th:action="@{/admin/vehicles}" method="get" class="d-flex align-items-end gap-2">
            <div class="me-3">
                <label for="keyword" class="form-label mb-1 small">Tìm theo biển số hoặc loại xe</label>
                <input type="text" id="keyword" name="keyword" class="form-control form-control-sm"
                       style="width: 340px;" th:value="${keyword}" placeholder="Ví dụ: 29H hoặc xe tải 1.5">
            </div>
            <div>
                <label for="status" class="form-label mb-1 small">Trạng thái</label>
                <select id="status" name="status" class="form-select form-select-sm" style="width: 160px;">
                    <option value="">Tất cả</option>
                    <option th:each="statusOption : ${statuses}"
                            th:value="${statusOption}"
                            th:text="${statusOption.displayName}"
                            th:selected="${statusOption == status}">Trạng thái</option>
                </select>
            </div>
            <button type="submit" class="btn btn-sm btn-primary">Tìm</button>
            <a th:href="@{/admin/vehicles}" class="btn btn-sm btn-outline-secondary">Bỏ lọc</a>
        </form>

        <a th:href="@{/admin/vehicles/create}" sec:authorize="hasRole('ADMIN')" class="btn btn-sm btn-primary">+ Thêm phương tiện</a>
    </div>

    <table class="table table-bordered table-striped table-sm align-middle">
        <thead>
        <tr>
            <th style="width: 130px;">Biển số</th>
            <th>Loại xe</th>
            <th style="width: 130px;" class="num">Tải trọng (kg)</th>
            <th style="width: 130px;" class="num">Thể tích (m³)</th>
            <th style="width: 120px;">Trạng thái</th>
            <th>Ghi chú</th>
            <th style="width: 230px;">Thao tác</th>
        </tr>
        </thead>
        <tbody>

        <tr th:if="${pageResult.empty}">
            <td colspan="7" class="text-center text-sub py-3">Không có phương tiện nào phù hợp.</td>
        </tr>

        <tr th:each="vehicle : ${pageResult.content}">
            <td th:text="${vehicle.licensePlate}">29H-123.45</td>
            <td th:text="${vehicle.vehicleType}">Xe tải 1.5 tấn</td>

            <td class="num" th:text="${#numbers.formatDecimal(vehicle.maxWeight, 1, 'NONE', 1, 'POINT')}">1500.0</td>
            <td class="num" th:text="${#numbers.formatDecimal(vehicle.maxVolume, 1, 'NONE', 3, 'POINT')}">12.000</td>

            <td>
                <span th:class="'status-tag ' + (${vehicle.status.name() == 'AVAILABLE'} ? 'status-tag-success'
                                        : (${vehicle.status.name() == 'IN_USE'}    ? 'status-tag-info'
                                                                             : 'status-tag-warning'))"
                      th:text="${vehicle.status.displayName}">Sẵn sàng</span>
            </td>

            <td class="text-sub" th:text="${vehicle.note}"></td>

            <td>
                <span sec:authorize="!hasRole('ADMIN')" class="text-sub">Chỉ xem</span>
                <div class="row-actions" sec:authorize="hasRole('ADMIN')">
                    <a class="btn btn-sm btn-outline-secondary"
                       th:href="@{/admin/vehicles/{id}/edit(id=${vehicle.id})}">Sửa</a>

                    <!--
                        Xe dang chay tuyen thi khong doi trang thai duoc. O day chi lam mo nut,
                        con viec chan that nam o VehicleService.toggleMaintenance (BR01-04, CBR-15).
                    -->
                    <span th:if="${vehicle.status.name() == 'IN_USE'}"
                          class="btn btn-sm btn-toggle disabled"
                          title="Xe đang chạy tuyến">Đang chạy</span>

                    <form th:unless="${vehicle.status.name() == 'IN_USE'}"
                          th:action="@{/admin/vehicles/{id}/toggle-status(id=${vehicle.id})}" method="post"
                          th:with="toMaintenance=${vehicle.status.name() == 'AVAILABLE'}"
                          th:data-confirm-title="${toMaintenance} ? 'Chuyển xe sang bảo trì' : 'Cho xe chạy lại'"
                          th:data-confirm-message="${toMaintenance}
                              ? 'Xe {subject} sẽ chuyển sang “Bảo trì” và không được chọn khi phân tuyến cho đến khi được cho chạy lại. Bạn xác nhận?'
                              : 'Xe {subject} sẽ chuyển từ “Bảo trì” sang “Sẵn sàng” và có thể được chọn khi phân tuyến. Bạn xác nhận?'"
                          th:data-confirm-subject="${vehicle.licensePlate}"
                          th:data-confirm-button="${toMaintenance} ? 'Chuyển bảo trì' : 'Cho chạy lại'"
                          th:data-confirm-variant="${toMaintenance} ? 'warning' : 'success'">
                        <button type="submit" class="btn btn-sm btn-toggle"
                                th:classappend="${vehicle.status.name() == 'AVAILABLE'} ? 'btn-turn-off' : 'btn-turn-on'"
                                th:text="${vehicle.status.name() == 'AVAILABLE'} ? 'Chuyển bảo trì' : 'Cho chạy lại'">
                            Chuyển bảo trì</button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:replace="~{fragments/pagination :: pager(
             pageResult       = ${pageResult},
             basePath    = '/admin/vehicles',
             keyword     = ${keyword},
             status      = ${status},
             role        = null,
             entityLabel = 'phương tiện')}"></div>

</div>

</body>
</html>
