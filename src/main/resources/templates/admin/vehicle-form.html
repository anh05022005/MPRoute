<!DOCTYPE html>
<!-- Them / sua phuong tien (CN-01-02) -->
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: main('Phương tiện', ~{::content})}">
<body>

<div th:fragment="content">

    <div th:replace="~{fragments/form-header :: form-header(
             rootLabel    = 'Danh mục',
             sectionLabel = 'Phương tiện',
             listPath     = '/admin/vehicles',
             isNew        = ${form.id == null},
             newTitle     = 'Thêm phương tiện',
             editTitle    = 'Sửa phương tiện')}"></div>

    <!-- Toan chieu rong man hinh: bon o so lieu chinh nam tren mot hang de nhin mot lan la du -->
    <form th:action="@{/admin/vehicles/save}" th:object="${form}" method="post" class="entry-form">

        <input type="hidden" th:field="*{id}">

        <div class="row g-3">

            <div class="col-md-6 col-xl-3">
                <label for="licensePlate" class="form-label">Biển số <span class="text-danger">*</span></label>
                <!-- Go "29h 12345" cung duoc: VehicleForm tu viet hoa va them gach noi, dau cham -->
                <input type="text" id="licensePlate" class="form-control" th:field="*{licensePlate}"
                       th:classappend="${#fields.hasErrors('licensePlate')} ? 'is-invalid'"
                       maxlength="12" autocomplete="off" placeholder="29H-123.45">
                <div class="invalid-feedback" th:errors="*{licensePlate}">Lỗi</div>
            </div>

            <div class="col-md-6 col-xl-3">
                <label for="vehicleType" class="form-label">Loại xe <span class="text-danger">*</span></label>
                <input type="text" id="vehicleType" class="form-control" th:field="*{vehicleType}"
                       th:classappend="${#fields.hasErrors('vehicleType')} ? 'is-invalid'"
                       placeholder="Xe tải 1.5 tấn">
                <div class="invalid-feedback" th:errors="*{vehicleType}">Lỗi</div>
            </div>

            <!--
                min / max o day chi la ho tro nhap lieu, khoang that va ly do chon khoang
                nam o VehicleForm — may chu chan lai neu ai gui thang request bo qua trinh duyet.
            -->
            <div class="col-md-6 col-xl-3">
                <label for="maxWeight" class="form-label">Tải trọng tối đa <span class="text-danger">*</span></label>
                <div class="input-group has-validation">
                    <input type="number" id="maxWeight" class="form-control" step="0.1" min="300" max="5000"
                           th:field="*{maxWeight}"
                           th:classappend="${#fields.hasErrors('maxWeight')} ? 'is-invalid'">
                    <span class="input-group-text">kg</span>
                    <div class="invalid-feedback" th:errors="*{maxWeight}">Lỗi</div>
                </div>
                <!-- Dang bao loi thi cau loi da noi khoang roi, an goi y cho khoi lap -->
                <div class="form-text" th:unless="${#fields.hasErrors('maxWeight')}">Từ 300 đến 5.000 kg</div>
            </div>

            <div class="col-md-6 col-xl-3">
                <label for="maxVolume" class="form-label">Thể tích thùng xe <span class="text-danger">*</span></label>
                <div class="input-group has-validation">
                    <input type="number" id="maxVolume" class="form-control" step="0.001" min="1" max="25"
                           th:field="*{maxVolume}"
                           th:classappend="${#fields.hasErrors('maxVolume')} ? 'is-invalid'">
                    <span class="input-group-text">m³</span>
                    <div class="invalid-feedback" th:errors="*{maxVolume}">Lỗi</div>
                </div>
                <div class="form-text" th:unless="${#fields.hasErrors('maxVolume')}">Từ 1 đến 25 m³</div>
            </div>

            <div class="col-md-6 col-xl-3">
                <label for="status" class="form-label">Trạng thái</label>

                <!--
                    BR01-04: o chon chi co San sang va Bao tri, KHONG co Dang chay.
                    Xe dang chay tuyen thi hien dang chu, khong cho sua — sua duoc thi
                    lan phan tuyen sau he thong lai xep them don cho xe dang ngoai duong.
                -->
                <div th:if="${form.status != null && form.status.name() == 'IN_USE'}">
                    <input type="text" class="form-control" value="Đang chạy" disabled>
                </div>

                <select th:unless="${form.status != null && form.status.name() == 'IN_USE'}"
                        id="status" class="form-select" th:field="*{status}"
                        th:classappend="${#fields.hasErrors('status')} ? 'is-invalid'">
                    <option th:each="statusOption : ${selectableStatuses}"
                            th:value="${statusOption}" th:text="${statusOption.displayName}">Trạng thái</option>
                </select>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('status')}"
                     th:errors="*{status}">Lỗi</div>
            </div>

            <div class="col-md-6 col-xl-9">
                <label for="note" class="form-label">Ghi chú</label>
                <textarea id="note" class="form-control" rows="3" th:field="*{note}"
                          th:classappend="${#fields.hasErrors('note')} ? 'is-invalid'"></textarea>
                <div class="invalid-feedback" th:errors="*{note}">Lỗi</div>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Lưu</button>
            <a th:href="@{/admin/vehicles}" class="btn btn-outline-secondary">Hủy</a>
        </div>
    </form>

</div>

</body>
</html>
