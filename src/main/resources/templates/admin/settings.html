<!DOCTYPE html>
<!-- SCR-09 — Tham so he thong (CN-01-08) -->
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: main('Tham số hệ thống', ~{::content})}">
<body>

<div th:fragment="content">

    <div class="page-title mb-1">Tham số hệ thống</div>

    <form th:action="@{/admin/settings/save}" th:object="${form}" method="post" style="max-width: 900px;">

        <table class="table table-bordered table-sm align-middle">
            <thead>
            <tr>
                <th style="width: 210px;">Mã tham số</th>
                <th style="width: 260px;">Giá trị</th>
                <th>Ý nghĩa</th>
            </tr>
            </thead>
            <tbody>

            <tr th:each="row, rowStat : *{items}">

                <td>
                    <!--
                        Ma tham so KHONG cho sua: no la khoa ma code tra cuu theo.
                        Gui len dang an de biet dong nao ung voi tham so nao; server
                        van chi ghi nhung ma da co san trong bang, ma la thi bo qua.
                    -->
                    <input type="hidden" th:field="*{items[__${rowStat.index}__].code}">
                    <code th:text="${row.code}">AVERAGE_SPEED</code>
                </td>

                <td>
                    <!-- Rieng thuat toan la o chon, khong cho go tay -->
                    <select th:if="${row.code == 'DEFAULT_ALGORITHM'}"
                            class="form-select form-select-sm"
                            th:field="*{items[__${rowStat.index}__].value}"
                            th:classappend="${#fields.hasErrors('items[__${rowStat.index}__].value')} ? 'is-invalid'">
                        <option th:each="algorithmOption : ${algorithms}"
                                th:value="${algorithmOption.name()}"
                                th:text="${algorithmOption.displayName}">OR-Tools</option>
                    </select>

                    <input th:unless="${row.code == 'DEFAULT_ALGORITHM'}"
                           type="text" class="form-control form-control-sm"
                           th:field="*{items[__${rowStat.index}__].value}"
                           th:classappend="${#fields.hasErrors('items[__${rowStat.index}__].value')} ? 'is-invalid'">

                    <div class="invalid-feedback d-block"
                         th:if="${#fields.hasErrors('items[__${rowStat.index}__].value')}"
                         th:errors="*{items[__${rowStat.index}__].value}">Lỗi</div>
                </td>

                <td class="small text-sub" th:text="${row.description}">Mô tả</td>
            </tr>
            </tbody>
        </table>

        <div class="mt-3">
            <button type="submit" class="btn btn-primary">Lưu</button>
            <a th:href="@{/admin/settings}" class="btn btn-outline-secondary">Hủy</a>
        </div>
    </form>

</div>

</body>
</html>
