<!DOCTYPE html>
<!-- SCR-02 — Danh muc san pham (CN-01-01) -->
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: main('Sản phẩm', ~{::content})}">
<body>

<div th:fragment="content">

    <div class="toolbar d-flex justify-content-between align-items-end flex-wrap gap-2">

        <!-- Tim kiem va loc. Dung GET de dia chi giu lai dieu kien loc,
             sao chep gui cho nguoi khac van ra dung ket qua -->
        <form th:action="@{/admin/products}" method="get" class="d-flex align-items-end gap-2">
            <div class="me-3">
                <label for="keyword" class="form-label mb-1 small">Tìm theo mã hoặc tên</label>
                <input type="text" id="keyword" name="keyword" class="form-control form-control-sm"
                       style="width: 340px;" th:value="${keyword}" placeholder="Ví dụ: SP001 hoặc bông">
            </div>
            <div>
                <label for="status" class="form-label mb-1 small">Trạng thái</label>
                <select id="status" name="status" class="form-select form-select-sm" style="width: 160px;">
                    <option value="">Tất cả</option>
                    <option th:each="statusOption : ${statuses}"
                            th:value="${statusOption}"
                            th:text="${statusOption.displayName}"
                            th:selected="${statusOption == status}">Trạng thái</option>
                </select>
            </div>
            <button type="submit" class="btn btn-sm btn-primary">Tìm</button>
            <a th:href="@{/admin/products}" class="btn btn-sm btn-outline-secondary">Bỏ lọc</a>
        </form>

        <!-- Moi man hinh chi mot nut xanh dac (docs/05-giao-dien.md) -->
        <a th:href="@{/admin/products/create}" sec:authorize="hasRole('ADMIN')" class="btn btn-sm btn-primary">+ Thêm sản phẩm</a>
    </div>

    <table class="table table-bordered table-striped table-sm align-middle">
        <thead>
        <tr>
            <th style="width: 90px;">Mã</th>
            <th>Tên sản phẩm</th>
            <th style="width: 80px;">Đơn vị</th>
            <th style="width: 110px;" class="num">kg/thùng</th>
            <th style="width: 110px;" class="num">m³/thùng</th>
            <th style="width: 120px;" class="num">Đơn giá</th>
            <th style="width: 130px;">Trạng thái</th>
            <th style="width: 230px;">Thao tác</th>
        </tr>
        </thead>
        <tbody>

        <tr th:if="${pageResult.empty}">
            <td colspan="8" class="text-center text-sub py-3">Không có sản phẩm nào phù hợp.</td>
        </tr>

        <tr th:each="product : ${pageResult.content}">
            <td th:text="${product.code}">SP001</td>
            <td th:text="${product.name}">Tên</td>
            <td th:text="${product.unit}">Thùng</td>

            <!-- Khoi luong 1 chu so thap phan, the tich 3 chu so (docs/05-giao-dien.md) -->
            <td class="num" th:text="${#numbers.formatDecimal(product.weightPerBox, 1, 'NONE', 1, 'POINT')}">6.0</td>
            <td class="num" th:text="${#numbers.formatDecimal(product.volumePerBox, 1, 'NONE', 3, 'POINT')}">0.085</td>

            <!-- Tien: dau cham ngan nghin, khong co so le -->
            <td class="num" th:text="${#numbers.formatInteger(product.unitPrice, 1, 'POINT')} + 'đ'">480.000đ</td>

            <td>
                <span th:class="${product.status.name() == 'ACTIVE'} ? 'status-tag status-tag-success' : 'status-tag status-tag-muted'"
                      th:text="${product.status.displayName}">Đang sử dụng</span>
            </td>

            <td>
                <span sec:authorize="!hasRole('ADMIN')" class="text-sub">Chỉ xem</span>
                <div class="row-actions" sec:authorize="hasRole('ADMIN')">
                    <a class="btn btn-sm btn-outline-secondary"
                       th:href="@{/admin/products/{id}/edit(id=${product.id})}">Sửa</a>

                    <!--
                        Khong co nut Xoa (CBR-17). San pham da nam trong don hang cu ma xoa cung
                        thi don cu mat thong tin, bao cao cu sai theo. Chi ngung su dung.
                        Dung POST chu khong dung link GET: link GET doi trang thai la ai gui
                        duong dan cho minh bam vao cung doi duoc (CSRF).
                    -->
                    <form th:action="@{/admin/products/{id}/toggle-status(id=${product.id})}" method="post"
                          th:with="isActive=${product.status.name() == 'ACTIVE'}"
                          th:data-confirm-title="${isActive} ? 'Ngừng dùng sản phẩm' : 'Dùng lại sản phẩm'"
                          th:data-confirm-message="${isActive}
                              ? 'Sản phẩm {subject} sẽ chuyển sang “Ngừng sử dụng” và không chọn được khi tạo đơn mới. Các đơn đã có vẫn giữ nguyên. Bạn xác nhận?'
                              : 'Sản phẩm {subject} sẽ chuyển sang “Đang sử dụng” và chọn được khi tạo đơn mới. Bạn xác nhận?'"
                          th:data-confirm-subject="${product.name}"
                          th:data-confirm-button="${isActive} ? 'Ngừng dùng' : 'Dùng lại'"
                          th:data-confirm-variant="${isActive} ? 'warning' : 'success'">
                        <button type="submit" class="btn btn-sm btn-toggle"
                                th:classappend="${product.status.name() == 'ACTIVE'} ? 'btn-turn-off' : 'btn-turn-on'"
                                th:text="${product.status.name() == 'ACTIVE'} ? 'Ngừng dùng' : 'Dùng lại'">Ngừng dùng</button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Phan trang - dung chung voi cac man hinh danh muc khac -->
    <div th:replace="~{fragments/pagination :: pager(
             pageResult       = ${pageResult},
             basePath    = '/admin/products',
             keyword     = ${keyword},
             status      = ${status},
             role        = null,
             entityLabel = 'sản phẩm')}"></div>

</div>

</body>
</html>
