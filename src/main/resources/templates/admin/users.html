<!DOCTYPE html>
<!-- SCR-08 — Danh muc tai khoan (CN-01-07) -->
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: main('Tài khoản', ~{::content})}">
<body>

<div th:fragment="content">

    <div class="toolbar d-flex justify-content-between align-items-end flex-wrap gap-2">

        <form th:action="@{/admin/users}" method="get" class="d-flex align-items-end gap-2 flex-wrap">
            <div class="me-3">
                <label for="keyword" class="form-label mb-1 small">Tìm theo tên đăng nhập hoặc họ tên</label>
                <input type="text" id="keyword" name="keyword" class="form-control form-control-sm"
                       style="width: 340px;" th:value="${keyword}" placeholder="Ví dụ: taixe hoặc Hùng">
            </div>
            <div>
                <label for="role" class="form-label mb-1 small">Vai trò</label>
                <select id="role" name="role" class="form-select form-select-sm" style="width: 150px;">
                    <option value="">Tất cả</option>
                    <option th:each="roleOption : ${roles}"
                            th:value="${roleOption}"
                            th:text="${roleOption.displayName}"
                            th:selected="${roleOption == role}">Vai trò</option>
                </select>
            </div>
            <div>
                <label for="status" class="form-label mb-1 small">Trạng thái</label>
                <select id="status" name="status" class="form-select form-select-sm" style="width: 140px;">
                    <option value="">Tất cả</option>
                    <option th:each="statusOption : ${statuses}"
                            th:value="${statusOption}"
                            th:text="${statusOption.displayName}"
                            th:selected="${statusOption == status}">Trạng thái</option>
                </select>
            </div>
            <button type="submit" class="btn btn-sm btn-primary">Tìm</button>
            <a th:href="@{/admin/users}" class="btn btn-sm btn-outline-secondary">Bỏ lọc</a>
        </form>

        <a th:href="@{/admin/users/create}" class="btn btn-sm btn-primary">+ Thêm tài khoản</a>
    </div>

    <table class="table table-bordered table-striped table-sm align-middle">
        <thead>
        <tr>
            <th style="width: 150px;">Tên đăng nhập</th>
            <th>Họ tên</th>
            <th style="width: 200px;">Email</th>
            <th style="width: 130px;">Vai trò</th>
            <th style="width: 180px;">Trạng thái</th>
            <th style="width: 330px;">Thao tác</th>
        </tr>
        </thead>
        <tbody>

        <tr th:if="${pageResult.empty}">
            <td colspan="6" class="text-center text-sub py-3">Không có tài khoản nào phù hợp.</td>
        </tr>

        <tr th:each="account : ${pageResult.content}">
            <td th:text="${account.username}">admin</td>
            <td th:text="${account.fullName}">Nguyễn Văn Quản</td>

            <!-- Email duoc phep NULL nen phai kiem truoc khi doc -->
            <td>
                <span th:if="${account.email != null}" th:text="${account.email}">a@b.com</span>
                <span th:unless="${account.email != null}" class="text-sub">—</span>
            </td>

            <td th:text="${account.role.displayName}">Quản trị viên</td>

            <!--
                Mot tai khoan co the bi khoa theo HAI cach doc lap nhau:
                  - status = LOCKED  : quan tri vien khoa vinh vien
                  - locked_until     : he thong khoa tam 15 phut do sai mat khau 5 lan (CN-00-03)
                Hien ca hai, vi nguoi dung goi dien bao "khong dang nhap duoc" thi quan tri vien
                phai nhin ra ngay dang vuong cai nao moi biet bam nut gi.
            -->
            <td>
                <span th:class="${account.status.name() == 'ACTIVE'} ? 'status-tag status-tag-success' : 'status-tag status-tag-danger'"
                      th:text="${account.status.displayName}">Hoạt động</span>

                <span th:if="${account.temporarilyLocked}" class="status-tag status-tag-muted d-block mt-1"
                      th:text="'Khóa tạm đến ' + ${#temporals.format(account.lockedUntil, 'HH:mm')}">
                    Khóa tạm đến 20:35</span>
            </td>

            <td>
                <div class="row-actions">
                    <a class="btn btn-sm btn-outline-secondary"
                       th:href="@{/admin/users/{id}/edit(id=${account.id})}">Sửa</a>

                    <!--
                        Khong co nut Xoa (CBR-17). Tai khoan da tao don, da chay tuyen ma xoa cung
                        thi lich su trang thai mat thong tin ai lam viec gi. Nghi viec thi khoa.
                        Dung POST chu khong dung link GET de con token CSRF.
                    -->
                    <form th:action="@{/admin/users/{id}/toggle-status(id=${account.id})}" method="post"
                          th:with="isActive=${account.status.name() == 'ACTIVE'}"
                          th:data-confirm-title="${isActive} ? 'Khóa tài khoản' : 'Mở khóa tài khoản'"
                          th:data-confirm-message="${isActive}
                              ? 'Tài khoản {subject} sẽ bị khóa và không đăng nhập được cho đến khi được mở khóa. Bạn xác nhận?'
                              : 'Tài khoản {subject} sẽ đăng nhập lại được. Bạn xác nhận?'"
                          th:data-confirm-subject="${account.username}"
                          th:data-confirm-button="${isActive} ? 'Khóa' : 'Mở khóa'"
                          th:data-confirm-variant="${isActive} ? 'warning' : 'success'">
                        <button type="submit" class="btn btn-sm btn-toggle"
                                th:classappend="${account.status.name() == 'ACTIVE'} ? 'btn-turn-off' : 'btn-turn-on'"
                                th:text="${account.status.name() == 'ACTIVE'} ? 'Khóa' : 'Mở khóa'">Khóa</button>
                    </form>

                    <!-- Chi hien khi dang thuc su vuong khoa tam, khong bay ra o moi dong cho roi mat -->
                    <form th:if="${account.temporarilyLocked}"
                          th:action="@{/admin/users/{id}/clear-lock(id=${account.id})}" method="post">
                        <button type="submit" class="btn btn-sm btn-turn-on">Gỡ khóa tạm</button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:replace="~{fragments/pagination :: pager(
             pageResult       = ${pageResult},
             basePath    = '/admin/users',
             keyword     = ${keyword},
             status      = ${status},
             role        = ${role},
             entityLabel = 'tài khoản')}"></div>

</div>

</body>
</html>
