<!DOCTYPE html>
<!-- SCR-05 — Danh muc tai xe (CN-01-03) -->
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: main('Tài xế', ~{::content})}">
<body>

<div th:fragment="content">

    <div class="toolbar d-flex justify-content-between align-items-end flex-wrap gap-2">

        <form th:action="@{/admin/drivers}" method="get" class="d-flex align-items-end gap-2">
            <div>
                <label for="keyword" class="form-label mb-1 small">Tìm theo họ tên hoặc số điện thoại</label>
                <input type="text" id="keyword" name="keyword" class="form-control form-control-sm"
                       style="width: 260px;" th:value="${keyword}" placeholder="Ví dụ: Hùng hoặc 0987">
            </div>
            <div>
                <label for="status" class="form-label mb-1 small">Trạng thái</label>
                <select id="status" name="status" class="form-select form-select-sm" style="width: 160px;">
                    <option value="">Tất cả</option>
                    <option th:each="statusOption : ${statuses}"
                            th:value="${statusOption}"
                            th:text="${statusOption.displayName}"
                            th:selected="${statusOption == status}">Trạng thái</option>
                </select>
            </div>
            <button type="submit" class="btn btn-sm btn-outline-secondary">Tìm</button>
            <a th:href="@{/admin/drivers}" class="btn btn-sm btn-outline-secondary">Bỏ lọc</a>
        </form>

        <a th:href="@{/admin/drivers/create}" sec:authorize="hasRole('ADMIN')" class="btn btn-sm btn-primary">+ Thêm tài xế</a>
    </div>

    <table class="table table-bordered table-striped table-sm align-middle">
        <thead>
        <tr>
            <th>Họ tên</th>
            <th style="width: 130px;">Số điện thoại</th>
            <th style="width: 130px;">Số GPLX</th>
            <th style="width: 140px;">Tài khoản</th>
            <th style="width: 190px;">Xe mặc định</th>
            <th style="width: 130px;">Trạng thái</th>
            <th style="width: 150px;">Thao tác</th>
        </tr>
        </thead>
        <tbody>

        <tr th:if="${pageResult.empty}">
            <td colspan="7" class="text-center text-sub py-3">Không có tài xế nào phù hợp.</td>
        </tr>

        <tr th:each="driver : ${pageResult.content}">
            <td th:text="${driver.fullName}">Nguyễn Văn Hùng</td>
            <td th:text="${driver.phone}">0987654321</td>
            <td class="text-sub" th:text="${driver.licenseNumber}"></td>

            <!--
                Ba o duoi day deu duoc phep NULL trong CSDL nen phai kiem truoc khi doc.
                Chua co tai khoan thi tai xe khong dang nhap xem tuyen cua minh duoc (BR05-01),
                nen ghi ro "Chua co" chu khong de o trong cho nguoi dung tu doan.
            -->
            <td>
                <span th:if="${driver.user != null}" th:text="${driver.user.username}">taixe1</span>
                <span th:unless="${driver.user != null}" class="text-sub small">Chưa có</span>
            </td>

            <td>
                <span th:if="${driver.defaultVehicle != null}"
                      th:text="${driver.defaultVehicle.licensePlate} + ' — ' + ${driver.defaultVehicle.vehicleType}">
                    29H-123.45 — Xe tải 1.5 tấn</span>
                <span th:unless="${driver.defaultVehicle != null}" class="text-sub small">Chưa gán</span>
            </td>

            <td>
                <span th:class="${driver.status.name() == 'ACTIVE'} ? 'status-tag status-tag-success' : 'status-tag status-tag-muted'"
                      th:text="${driver.status.displayName}">Đang sử dụng</span>
            </td>

            <td>
                <span sec:authorize="!hasRole('ADMIN')" class="text-sub small">Chỉ xem</span>
                <a class="btn btn-sm btn-outline-secondary py-0" sec:authorize="hasRole('ADMIN')"
                   th:href="@{/admin/drivers/{id}/edit(id=${driver.id})}">Sửa</a>

                <!--
                    Khong co nut Xoa (CBR-17, BR01-09). Tai xe da chay tuyen cu ma xoa cung
                    thi bao cao cu mat thong tin ai chay tuyen nao. Chi ngung su dung.
                    Dung POST chu khong dung link GET de tranh CSRF.
                -->
                <form th:action="@{/admin/drivers/{id}/toggle-status(id=${driver.id})}" method="post" sec:authorize="hasRole('ADMIN')"
                      class="d-inline"
                      onsubmit="return confirm('Bạn có chắc chắn muốn thực hiện thao tác này?');">
                    <button type="submit" class="btn btn-sm btn-outline-secondary py-0"
                            th:text="${driver.status.name() == 'ACTIVE'} ? 'Ngừng dùng' : 'Dùng lại'">Ngừng dùng</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:replace="~{fragments/pagination :: pager(
             pageResult       = ${pageResult},
             basePath    = '/admin/drivers',
             keyword     = ${keyword},
             status      = ${status},
             role        = null,
             entityLabel = 'tài xế')}"></div>

</div>

</body>
</html>
