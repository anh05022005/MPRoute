<!DOCTYPE html>
<!--
    Bo cuc dung chung cho moi trang (CN-00-06).

    Cach dung o mot trang con:
        <html th:replace="~{layout :: main('Ten trang', ~{::content})}">
        ...
        <div th:fragment="content"> noi dung rieng cua trang </div>

    Khong dung thu vien layout-dialect, chi dung co san cua Thymeleaf 3:
    truyen mot manh (fragment) vao lam tham so.
-->
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="main(pageTitle, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' — MPRoute'">MPRoute</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <!--
        Leaflet chi nap o nhung man hinh co ban do (form khach hang, form kho).
        Controller nao can thi dat model.addAttribute("needsMap", true).
        Khong nap toan cuc vi 162 KB do la thua o 12 man hinh con lai.
    -->
    <link th:if="${needsMap}" rel="stylesheet" th:href="@{/css/leaflet.css}">
</head>
<body>

<!-- ============ Thanh tieu de ============ -->
<header class="app-header d-flex justify-content-between align-items-center">
    <div class="app-brand">
        <span class="app-logo" aria-hidden="true">MP</span>
        <span class="app-name">Minh Phú — Quản lý giao hàng</span>
    </div>

    <div class="app-user" sec:authorize="isAuthenticated()">
        <span>
            <span class="app-user-name" th:text="${#authentication.principal.fullName}">Người dùng</span>
            <span class="app-user-role"
                  th:text="'(' + ${#authentication.principal.role.displayName} + ')'">(Vai trò)</span>
        </span>
        <span class="app-user-divider" aria-hidden="true"></span>
        <a th:href="@{/change-password}">Đổi mật khẩu</a>
        <!-- Dang xuat phai la form POST: neu de link GET thi ke khac chi can du
             nguoi dung bam vao mot duong dan la da dang xuat ho (tan cong CSRF) -->
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-sm btn-outline-light btn-logout">Đăng xuất</button>
        </form>
    </div>
</header>

<!-- ============ Thanh menu, hien theo vai tro ============ -->
<!-- Tai xe khong co menu, chi co mot man hinh duy nhat (docs/05-giao-dien.md) -->
<!-- currentPath do NavigationAdvice dua vao. Trang loi khong qua Controller thuong co the
     khong co bien nay, nen doi null ve chuoi rong truoc khi so khop -->
<nav class="app-nav" sec:authorize="hasAnyRole('ADMIN', 'DISPATCHER')"
     th:with="path=${currentPath ?: ''}">
    <ul class="nav">

        <!-- Dieu phoi vien XEM duoc danh muc nhung khong sua. Nut Them/Sua bi an trong
             tung man hinh, va chan that o @PreAuthorize cua Controller (CBR-15) -->
        <li class="nav-item dropdown" sec:authorize="hasAnyRole('ADMIN', 'DISPATCHER')">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown"
               th:classappend="${#strings.startsWith(path, '/admin/products')
                                 or #strings.startsWith(path, '/admin/vehicles')
                                 or #strings.startsWith(path, '/admin/drivers')
                                 or #strings.startsWith(path, '/admin/customers')
                                 or #strings.startsWith(path, '/admin/depot')} ? 'is-active'">Danh mục</a>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" th:href="@{/admin/products}"
                       th:classappend="${#strings.startsWith(path, '/admin/products')} ? 'active'">Sản phẩm</a></li>
                <li><a class="dropdown-item" th:href="@{/admin/vehicles}"
                       th:classappend="${#strings.startsWith(path, '/admin/vehicles')} ? 'active'">Phương tiện</a></li>
                <li><a class="dropdown-item" th:href="@{/admin/drivers}"
                       th:classappend="${#strings.startsWith(path, '/admin/drivers')} ? 'active'">Tài xế</a></li>
                <li><a class="dropdown-item" th:href="@{/admin/customers}"
                       th:classappend="${#strings.startsWith(path, '/admin/customers')} ? 'active'">Khách hàng</a></li>
                <li><a class="dropdown-item" th:href="@{/admin/depot}"
                       th:classappend="${#strings.startsWith(path, '/admin/depot')} ? 'active'">Kho</a></li>
            </ul>
        </li>

        <!--
            Ton kho KHONG nam trong menu Danh muc, du cung o duong dan /admin.
            Ly do: nhap kho la viec van hanh lam hang ngay, giong don hang chu khong giong
            danh muc — va dieu phoi vien SUA duoc o day trong khi danh muc thi chi xem.
            Gop vao mot menu la mo duong cho nham lan ve quyen.
        -->
        <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'DISPATCHER')">
            <a class="nav-link" th:href="@{/admin/stock}"
               th:classappend="${#strings.startsWith(path, '/admin/stock')} ? 'is-active'">Tồn kho</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
            <a class="nav-link" th:href="@{/admin/users}"
               th:classappend="${#strings.startsWith(path, '/admin/users')} ? 'is-active'">Tài khoản</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
            <a class="nav-link" th:href="@{/admin/settings}"
               th:classappend="${#strings.startsWith(path, '/admin/settings')} ? 'is-active'">Tham số</a>
        </li>

        <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'DISPATCHER')">
            <a class="nav-link" th:href="@{/orders}"
               th:classappend="${#strings.startsWith(path, '/orders')} ? 'is-active'">Đơn hàng</a>
        </li>
        <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'DISPATCHER')">
            <a class="nav-link" th:href="@{/routing}"
               th:classappend="${#strings.startsWith(path, '/routing')} ? 'is-active'">Phân tuyến</a>
        </li>
        <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'DISPATCHER')">
            <a class="nav-link" th:href="@{/tracking}"
               th:classappend="${#strings.startsWith(path, '/tracking')} ? 'is-active'">Theo dõi</a>
        </li>
        <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'DISPATCHER')">
            <a class="nav-link" th:href="@{/incidents}"
               th:classappend="${#strings.startsWith(path, '/incidents')} ? 'is-active'">Sự cố</a>
        </li>
        <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'DISPATCHER')">
            <a class="nav-link" th:href="@{/reports}"
               th:classappend="${#strings.startsWith(path, '/reports')} ? 'is-active'">Báo cáo</a>
        </li>
    </ul>
</nav>

<!-- ============ Vung noi dung ============ -->
<main class="container-fluid py-3">

    <!-- Cho nay duoc thay bang manh noi dung ma trang con truyen vao -->
    <div th:replace="${content}">Nội dung trang</div>
</main>

<!-- ============ Thong bao dang toast ============ -->
<!-- Cac Controller dat flash attribute "successMessage" hoac "errorMessage".
     Dung toast noi o goc phai thay vi alert chen dau trang: alert day noi dung xuong roi lai
     giat len khi tu an, con toast khong lam xe dich bo cuc.
     Dat duoi thanh tieu de (app-toast-area) de khong che nut Dang xuat. -->
<div class="toast-container position-fixed end-0 p-3 app-toast-area">

    <!-- Thanh cong: tu an sau 4 giay — cau ngan, chi de xac nhan da lam xong -->
    <div th:if="${successMessage}" class="toast align-items-center text-bg-success border-0"
         role="status" aria-live="polite" aria-atomic="true" data-bs-delay="4000">
        <div class="d-flex">
            <div class="toast-body" th:text="${successMessage}"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast" aria-label="Đóng"></button>
        </div>
    </div>

    <!-- Loi: KHONG tu an, phai bam X moi dong. Nguoi dung can doc ky de biet sua gi
         (vi du MSG-17 thieu hang ton), tu an la mat thong tin -->
    <div th:if="${errorMessage}" class="toast align-items-center text-bg-danger border-0"
         role="alert" aria-live="assertive" aria-atomic="true" data-bs-autohide="false">
        <div class="d-flex">
            <div class="toast-body" th:text="${errorMessage}"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast" aria-label="Đóng"></button>
        </div>
    </div>
</div>

<!-- ============ Hop xac nhan dung chung ============ -->
<!-- Thay cho confirm() cua trinh duyet ("localhost says"). Noi dung do tung form tu khai
     bang data-confirm-*, xem huong dan o dau file js/confirm-dialog.js -->
<div class="modal fade confirm-dialog" id="confirm-dialog" tabindex="-1"
     aria-labelledby="confirm-dialog-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="confirm-dialog-title">Xác nhận</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
            </div>
            <div class="modal-body" id="confirm-dialog-message"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" id="confirm-dialog-cancel"
                        data-bs-dismiss="modal">Hủy</button>
                <button type="button" class="btn btn-primary" id="confirm-dialog-ok">Đồng ý</button>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<!-- Bao loi nhap lieu bang chu do duoi o thay cho bong bong tieng Anh cua trinh duyet -->
<script th:src="@{/js/form-validation.js}"></script>
<script th:src="@{/js/confirm-dialog.js}"></script>

<!-- Toast cua Bootstrap khong tu hien, phai goi show(). Thoi gian an doc tu data-bs-delay /
     data-bs-autohide tren tung toast o tren -->
<script>
    document.querySelectorAll('.app-toast-area .toast').forEach(function (toastEl) {
        bootstrap.Toast.getOrCreateInstance(toastEl).show();
    });
</script>

<!-- Thu tu quan trong: leaflet.js phai chay xong truoc thi location-picker.js moi thay bien L -->
<script th:if="${needsMap}" th:src="@{/js/leaflet.js}"></script>
<script th:if="${needsMap}" th:src="@{/js/location-picker.js}"></script>

<!-- Man hinh don hang: tinh tong kg/m3/tien ngay khi go (CN-02-03) va nut sao chep
     khoi tom tat (CN-02-06). Controller nao can thi dat model.addAttribute("needsOrderJs", true) -->
<script th:if="${needsOrderJs}" th:src="@{/js/order-form.js}"></script>

<!-- Man hinh phan tuyen: ve diem giao len ban do (CN-03-02).
     Can ca canBanDo de nap Leaflet truoc.
     Man hinh su co dung lai chinh file nay de ve vi tri xe va cac diem chua giao (CN-06-06) -->
<!-- So sanh voi null chu khong viet thang "a or b": man hinh nao khong dat co nao thi bien do
     la null, ma SpEL khong doi duoc null sang boolean — ca trang se hong voi loi EL1001E -->
<script th:if="${needsRoutingJs != null or needsIncidentJs != null}"
        th:src="@{/js/routing-map.js}"></script>

<!-- Man hinh phan tuyen: cong suc chua cac xe da tich chon (CN-03-03). Khong can Leaflet -->
<script th:if="${needsRoutingJs}" th:src="@{/js/routing-fleet.js}"></script>

<!-- Man hinh phan tuyen: keo tha chinh tay tuyen (CN-04-01 -> CN-04-05). Khong can Leaflet -->
<script th:if="${needsRoutingJs}" th:src="@{/js/routing-arrange.js}"></script>

<!-- Man hinh tai xe: lay toa do GPS va mo cac o bat buoc nhap (CN-05-06 -> CN-05-09) -->
<script th:if="${needsDriverJs}" th:src="@{/js/driver-route.js}"></script>
</body>
</html>
