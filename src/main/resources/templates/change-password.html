<!DOCTYPE html>
<!-- Doi mat khau (CN-00-05) -->
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: main('Đổi mật khẩu', ~{::content})}">
<body>

<div th:fragment="content">

    <h1 class="h4 mb-3">Đổi mật khẩu</h1>

    <form th:action="@{/change-password}" th:object="${form}" method="post" style="max-width: 420px;">

        <div class="mb-3">
            <label for="currentPassword" class="form-label">Mật khẩu hiện tại</label>
            <input type="password" id="currentPassword" class="form-control"
                   th:field="*{currentPassword}"
                   th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{currentPassword}">Lỗi</div>
        </div>

        <div class="mb-3">
            <label for="newPassword" class="form-label">Mật khẩu mới</label>
            <input type="password" id="newPassword" class="form-control"
                   th:field="*{newPassword}"
                   th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{newPassword}">Lỗi</div>
        </div>

        <div class="mb-3">
            <label for="confirmPassword" class="form-label">Nhập lại mật khẩu mới</label>
            <input type="password" id="confirmPassword" class="form-control"
                   th:field="*{confirmPassword}"
                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{confirmPassword}">Lỗi</div>
        </div>

        <button type="submit" class="btn btn-primary">Lưu mật khẩu mới</button>
        <a class="btn btn-outline-secondary" th:href="@{/}">Hủy</a>
    </form>

</div>

</body>
</html>
