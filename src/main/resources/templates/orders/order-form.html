<!DOCTYPE html>
<!-- SCR-08 — Tao don hang (CN-02-02, CN-02-03, CN-02-05) -->
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: main('Tạo đơn hàng', ~{::content})}">
<body>

<div th:fragment="content">

    <div class="page-title mb-3" th:text="${form.id == null} ? 'Tạo đơn hàng' : 'Sửa đơn hàng ' + ${form.code}">Tạo đơn hàng</div>

    <form th:action="@{/orders/save}" th:object="${form}" method="post" id="order-form">

        <input type="hidden" th:field="*{id}">

        <!--
            Loi chung cua ca don (thieu dong chi tiet BR02-02, vuot suc chua BR02-05):
            khong gan duoc vao mot o nhap cu the nen hien thanh mot khoi rieng o dau form.
        -->
        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger py-2">
            <div th:each="globalError : ${#fields.globalErrors()}" th:text="${globalError}">Lỗi</div>
        </div>

        <div class="row g-3">

            <!-- ============ Khach hang va ngay giao ============ -->
            <div class="col-md-6">
                <label for="customerId" class="form-label">Khách hàng <span class="text-danger">*</span></label>
                <!--
                    O go de tim khach theo ten, so dien thoai hoac dia chi. Danh sach khach that
                    van la the <select> ben duoi — o go nay chi la lop tim kiem dat len tren:
                    chon xong thi order-form.js gan gia tri vao <select>, nen form gui len may
                    chu y nhu cu (customerId). Tat JavaScript thi o go an di, <select> hien lai.
                -->
                <div class="combo" id="customer-combo" hidden>
                    <input type="text" id="customer-search" class="form-select" autocomplete="off"
                           placeholder="Gõ tên, số điện thoại hoặc địa chỉ để tìm khách"
                           role="combobox" aria-autocomplete="list" aria-expanded="false"
                           aria-controls="customer-options"
                           th:classappend="${#fields.hasErrors('customerId')} ? 'is-invalid'">
                    <div class="combo-menu" id="customer-options" role="listbox" hidden></div>
                </div>

                <!--
                    Cac thuoc tinh data-* la nguon de JavaScript tu dien dia chi, toa do,
                    hinh thuc thanh toan khi chon khach (BR02-07). Chi khach ACTIVE moi
                    co trong danh sach nay.
                -->
                <select id="customerId" class="form-select" th:field="*{customerId}"
                        th:classappend="${#fields.hasErrors('customerId')} ? 'is-invalid'">
                    <option value="">— Chọn khách hàng —</option>
                    <option th:each="customer : ${customers}"
                            th:value="${customer.id}"
                            th:text="${customer.name} + ' — ' + ${customer.phone}"
                            th:attr="data-address=${customer.address},
                                     data-latitude=${customer.latitude},
                                     data-longitude=${customer.longitude},
                                     data-payment-method=${customer.paymentMethod},
                                     data-delivery-note=${customer.deliveryNote}">Tạp hóa Bà Lan</option>
                </select>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('customerId')}"
                     th:errors="*{customerId}">Lỗi</div>

                <!-- Ghi chu giao hang cua khach (BR01-07) — dieu phoi vien can thay truoc khi chot -->
                <div id="customer-delivery-note" class="form-text"></div>
            </div>

            <div class="col-md-3">
                <label for="deliveryDate" class="form-label">Ngày giao <span class="text-danger">*</span></label>
                <!-- BR02-06: mac dinh ngay mai, khong nho hon hom nay. Thuoc tinh min chi
                     de trinh duyet chan truoc cho de dung, cho chan that o Controller -->
                <input type="date" id="deliveryDate" class="form-control" th:field="*{deliveryDate}"
                       th:attr="min=${#temporals.format(#temporals.createToday(), 'yyyy-MM-dd')}"
                       th:classappend="${#fields.hasErrors('deliveryDate')} ? 'is-invalid'">
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('deliveryDate')}"
                     th:errors="*{deliveryDate}">Lỗi</div>
            </div>

            <div class="col-md-3">
                <label for="paymentMethod" class="form-label">Hình thức thanh toán <span class="text-danger">*</span></label>
                <select id="paymentMethod" class="form-select" th:field="*{paymentMethod}"
                        th:classappend="${#fields.hasErrors('paymentMethod')} ? 'is-invalid'">
                    <option th:each="paymentMethodOption : ${paymentMethods}"
                            th:value="${paymentMethodOption}" th:text="${paymentMethodOption.displayName}">Tiền mặt</option>
                </select>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('paymentMethod')}"
                     th:errors="*{paymentMethod}">Lỗi</div>
                <!-- BR02-16: doi o nay la so tien phai thu doi theo ngay -->
            </div>

            <!-- ============ Dia chi giao ============ -->
            <div class="col-12">
                <label for="delivery-address" class="form-label">Địa chỉ giao</label>
                <!--
                    Chi de NHIN, khong co thuoc tinh name nen khong gui len may chu: dia chi va
                    toa do cua don luon chep tu danh muc khach hang o OrderService (BR02-07).
                    order-form.js dien o nay khi chon khach. Can giao cho khac thi sua danh muc.
                -->
                <input type="text" id="delivery-address" class="form-control"
                       placeholder="Chọn khách hàng để hiện địa chỉ" readonly>
            </div>
        </div>

        <!-- ============ CN-02-03 Cac dong chi tiet ============ -->
        <h2 class="h6 mt-4">Chi tiết đơn hàng</h2>

        <table class="table table-bordered table-sm align-middle" id="order-lines-table">
            <thead>
            <tr>
                <th>Sản phẩm</th>
                <th style="width: 110px;">Số thùng</th>
                <th style="width: 120px;">Khối lượng</th>
                <th style="width: 120px;">Thể tích</th>
                <th style="width: 140px;">Đơn giá</th>
                <th style="width: 140px;">Thành tiền</th>
                <th style="width: 50px;"></th>
            </tr>
            </thead>

            <tbody id="order-lines-body">
            <tr class="order-line" th:each="row, rowStat : *{items}">
                <td>
                    <!--
                        Viet th:name tay thay vi th:field vi cac dong duoc them/xoa bang
                        JavaScript, chi so phai danh lai sau moi lan xoa. Spring van gan
                        duoc vao List<OrderItemForm> nho ten dang items[0].productId.
                    -->
                    <select class="form-select form-select-sm line-product"
                            th:name="'items[' + ${rowStat.index} + '].productId'">
                        <option value="">— Chọn sản phẩm —</option>
                        <option th:each="product : ${products}"
                                th:value="${product.id}"
                                th:selected="${product.id == row.productId}"
                                th:text="${product.name} + ' (' + ${product.unit} + ')'"
                                th:attr="data-weight=${product.weightPerBox},
                                         data-volume=${product.volumePerBox},
                                         data-price=${product.unitPrice},
                                         data-stock=${availableStock.get(product.id)}">Bông tẩy trang</option>
                    </select>

                    <!--
                        So thung con ranh, hien ngay duoi o chon san pham.
                        Dieu phoi vien dang nghe dien thoai can tra loi "hang con khong" tai cho —
                        bat ho mo man hinh khac de tra la khong ai dung.

                        Day chi la so THAM KHAO: don con cho duyet chua giu hang, nen hai don cung
                        luc deu nhin thay cung mot con so. Cho chan cung la buoc bam Duyet don,
                        o do moi tru kho that (MSG-17).
                    -->
                    <small class="line-stock text-sub d-block mt-1"></small>
                </td>
                <td>
                    <input type="number" min="1" step="1" class="form-control form-control-sm line-box-count"
                           th:name="'items[' + ${rowStat.index} + '].boxCount'"
                           th:value="${row.boxCount}">
                </td>
                <!-- Ba o nay chi de nhin, khong gui len may chu: may chu tinh lai tu danh muc (BR02-04) -->
                <td class="num line-weight">—</td>
                <td class="num line-volume">—</td>
                <td class="num line-unit-price">—</td>
                <td class="num line-total">—</td>
                <td>
                    <button type="button" class="btn btn-sm btn-outline-secondary py-0 remove-line"
                            title="Xóa dòng">×</button>
                </td>
            </tr>
            </tbody>

            <tfoot>
            <tr>
                <th colspan="2" class="text-end">Tổng cộng</th>
                <th class="num" id="total-weight">—</th>
                <th class="num" id="total-volume">—</th>
                <th></th>
                <th class="num" id="total-amount">—</th>
                <th></th>
            </tr>
            <tr>
                <th colspan="5" class="text-end">Số tiền phải thu khi giao</th>
                <th class="num" id="amount-to-collect">—</th>
                <th></th>
            </tr>
            </tfoot>
        </table>

        <button type="button" class="btn btn-sm btn-outline-secondary" id="add-line">+ Thêm sản phẩm</button>

        <div class="row g-3 mt-1">
            <div class="col-md-8">
                <label for="note" class="form-label">Ghi chú đơn hàng</label>
                <textarea id="note" class="form-control" rows="2" th:field="*{note}"
                          th:classappend="${#fields.hasErrors('note')} ? 'is-invalid'"
                          placeholder="Khách dặn gọi trước 15 phút."></textarea>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('note')}"
                     th:errors="*{note}">Lỗi</div>
            </div>
        </div>

        <div class="mt-3">
            <button type="submit" class="btn btn-primary">Lưu đơn hàng</button>
            <a th:href="@{/orders}" class="btn btn-outline-secondary">Hủy</a>
        </div>
    </form>

</div>

</body>
</html>
