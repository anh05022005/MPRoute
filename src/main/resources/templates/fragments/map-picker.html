<!DOCTYPE html>
<!--
    Manh chon toa do dung chung cho form khach hang va form kho (CN-01-05).

    Cach dung o trang con:
        <div th:replace="~{fragments/map-picker :: map-picker}"></div>
    va Controller phai dat model.addAttribute("needsMap", true) de layout nap Leaflet.

    Manh nay tim ba o nhap theo id: address, latitude, longitude.
    Ca hai form deu dat dung ba id do.
-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="map-picker">

    <div class="d-flex align-items-center gap-2 mb-2">
        <!--
            type="button" la BAT BUOC. De mac dinh thi trong <form> no thanh nut submit,
            bam "Tim toa do" se gui luon ca form di.
        -->
        <button type="button" id="geocode-search" class="btn btn-sm btn-outline-secondary">
            Tìm tọa độ từ địa chỉ
        </button>
        <span id="geocode-status" class="small text-sub"></span>
    </div>

    <!-- Nominatim tra nhieu ket qua thi hien danh sach de chon (BR01-06) -->
    <div id="geocode-results" class="list-group mb-2 d-none" style="max-height: 190px; overflow-y: auto;"></div>

    <div class="map-frame">
        <div id="location-map" class="map-canvas"></div>
    </div>

</div>

</body>
</html>
