<!DOCTYPE html>
<!--
    Thanh phan trang dung chung cho cac man hinh danh muc.

    Cach dung:
        <div th:replace="~{fragments/pagination :: pager(
                 pageResult  = ${pageResult},
                 basePath    = '/admin/vehicles',
                 keyword     = ${keyword},
                 status      = ${status},
                 role        = null,
                 entityLabel = 'xe')}"></div>

    Cac o loc duoc viet cung vao day thay vi nhan mot Map linh hoat, vi cac man hinh
    danh muc dung chung mot bo o loc. Viet cung thi de doc hon va sua o mot cho.

    Tham so "role" chi rieng man hinh danh muc tai khoan (CN-01-07) dung toi. Cac man hinh
    khac truyen null — Thymeleaf bo qua tham so null nen dia chi khong bi dinh "?role=".
    Bat buoc truyen du ca 6 tham so: goi thieu mot cai la Thymeleaf bao loi ngay.
-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="pager(pageResult, basePath, keyword, status, role, entityLabel)"
     class="d-flex justify-content-between align-items-center"
     th:if="${pageResult.totalPages > 1}">

    <span class="text-sub small">
        Trang <span th:text="${pageResult.number + 1}">1</span>/<span th:text="${pageResult.totalPages}">1</span>
        — tổng <span th:text="${pageResult.totalElements}">0</span> <span th:text="${entityLabel}">bản ghi</span>
    </span>

    <ul class="pagination pagination-sm mb-0">

        <li class="page-item" th:classappend="${pageResult.first} ? 'disabled'">
            <a class="page-link"
               th:href="@{${basePath}(page=${pageResult.number - 1}, keyword=${keyword}, status=${status}, role=${role})}">Trước</a>
        </li>

        <!-- Mang trang danh so tu 0 nhung nguoi dung dem tu 1, nen hien i + 1 -->
        <li class="page-item" th:each="i : ${#numbers.sequence(0, pageResult.totalPages - 1)}"
            th:classappend="${i == pageResult.number} ? 'active'">
            <a class="page-link"
               th:href="@{${basePath}(page=${i}, keyword=${keyword}, status=${status}, role=${role})}"
               th:text="${i + 1}">1</a>
        </li>

        <li class="page-item" th:classappend="${pageResult.last} ? 'disabled'">
            <a class="page-link"
               th:href="@{${basePath}(page=${pageResult.number + 1}, keyword=${keyword}, status=${status}, role=${role})}">Sau</a>
        </li>
    </ul>
</div>

<!--
    Ban rieng cho man hinh don hang (CN-02-01). Bo o loc cua don khac han danh muc:
    loc theo ngay giao va khach hang chu khong phai tu khoa. Viet mot manh rieng
    thay vi nhoi them tham so vao manh tren — sang trang ma rot mat dieu kien loc
    la loi nguoi dung khong nhin ra ngay.

    Cach dung:
        <div th:replace="~{fragments/pagination :: order-pager(
                 pageResult   = ${pageResult},
                 deliveryDate = ${deliveryDate},
                 status       = ${status},
                 customerId   = ${customerId})}"></div>
-->
<div th:fragment="order-pager(pageResult, deliveryDate, status, customerId)"
     class="d-flex justify-content-between align-items-center"
     th:if="${pageResult.totalPages > 1}">

    <span class="text-sub small">
        Trang <span th:text="${pageResult.number + 1}">1</span>/<span th:text="${pageResult.totalPages}">1</span>
        — tổng <span th:text="${pageResult.totalElements}">0</span> đơn hàng
    </span>

    <ul class="pagination pagination-sm mb-0">

        <li class="page-item" th:classappend="${pageResult.first} ? 'disabled'">
            <a class="page-link"
               th:href="@{/orders(page=${pageResult.number - 1}, deliveryDate=${deliveryDate},
                                  status=${status}, customerId=${customerId})}">Trước</a>
        </li>

        <li class="page-item" th:each="i : ${#numbers.sequence(0, pageResult.totalPages - 1)}"
            th:classappend="${i == pageResult.number} ? 'active'">
            <a class="page-link"
               th:href="@{/orders(page=${i}, deliveryDate=${deliveryDate},
                                  status=${status}, customerId=${customerId})}"
               th:text="${i + 1}">1</a>
        </li>

        <li class="page-item" th:classappend="${pageResult.last} ? 'disabled'">
            <a class="page-link"
               th:href="@{/orders(page=${pageResult.number + 1}, deliveryDate=${deliveryDate},
                                  status=${status}, customerId=${customerId})}">Sau</a>
        </li>
    </ul>
</div>

</body>
</html>
