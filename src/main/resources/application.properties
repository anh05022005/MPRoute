spring.application.name=MPRoute

# ==================== KET NOI CO SO DU LIEU ====================
# Hai tham so useUnicode va characterEncoding la BAT BUOC.
# Thieu chung thi tieng Viet luu vao MySQL se thanh dau hoi (???).
#
# Ve mui gio: may chu MySQL o day chay trong WSL nen dong ho cua no la UTC,
# lech 7 tieng so voi gio Viet Nam ma ung dung Java dung khi ghi du lieu.
# Khong xu ly thi moi cau lenh SQL dung NOW() hay CURDATE() deu lech 7 tieng —
# loc don "hom nay" se ra sai ngay.
# forceConnectionTimeZoneToSession=true bao trinh dieu khien chay SET time_zone='+07:00'
# ngay khi mo ket noi, nho vay NOW() ben MySQL tra ve dung gio Viet Nam.
# (connectionTimeZone la ten moi cua serverTimezone tu Connector/J 8.0.23)
spring.datasource.url=jdbc:mysql://localhost:3306/mproute?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Ho_Chi_Minh&forceConnectionTimeZoneToSession=true
# Credentials come from the environment so no real password ever lands in git.
# The defaults after `:` are the throwaway values of the local dev database.
spring.datasource.username=${MPROUTE_DB_USER:root}
spring.datasource.password=${MPROUTE_DB_PASSWORD:gbao}

# ==================== JPA / HIBERNATE ====================
# update: tu sinh bang tu cac lop entity, khong can viet script CREATE TABLE.
# Luu y: update KHONG xoa cot cu. Doi ten truong Java thi phai xoa cot cu bang tay.
spring.jpa.hibernate.ddl-auto=update

# Giu show-sql bat trong suot qua trinh lam do an.
# Nhin duoc cau SQL that ma JPA sinh ra, rat huu ich khi giai thich truoc hoi dong.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# LUU Y ve enum: Hibernate 6 mac dinh anh xa @Enumerated(STRING) sang kieu ENUM
# native cua MySQL. Khong dat duoc bang tham so o day (da thu
# hibernate.type.prefer_native_enum_types=false, khong an), phai danh dau tung truong
# bang @JdbcTypeCode(SqlTypes.VARCHAR) trong entity. Xem ly do trong docs/02.

# Giu ket noi mo trong suot qua trinh render Thymeleaf.
# Duoc: khong bi LazyInitializationException khi template doc quan he @ManyToOne.
# Mat: co the sinh them truy van luc render (van de N+1).
# Chon true vi do an uu tien cach don gian chay duoc. Doi thanh false neu muon
# chat che hon, nhung khi do phai nap san du lieu o tang service truoc khi tra view.
spring.jpa.open-in-view=true

# ==================== MA HOA TIENG VIET ====================
spring.thymeleaf.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ==================== THYMELEAF ====================
# Tat cache luc dang lam de sua file .html la thay doi ngay, khong can khoi dong lai.
# Khi nop bai co the bat lai thanh true.
spring.thymeleaf.cache=false

# ==================== TIM TOA DO (NOMINATIM) ====================
# Dich vu geocoding cong cong cua OpenStreetMap (CN-01-05).
# Chinh sach su dung cua ho bat buoc hai dieu, ca hai da lam trong GeocodingService:
#   - moi request phai co User-Agent nhan dang duoc ung dung
#   - toi da 1 request moi giay
# Doi mproute.nominatim.url neu sau nay tu dung mot ban Nominatim rieng.
mproute.nominatim.url=https://nominatim.openstreetmap.org
mproute.nominatim.user-agent=MPRoute-DoAnTotNghiep/1.0
# Khung toa do bao quanh Ha Noi mo rong, thu tu: lon_trai,lat_tren,lon_phai,lat_duoi.
# Chi nhan ket qua nam trong khung nay — khong co no thi Nominatim doan bua sang
# tinh khac (vi du "15 Kim Giang, Thanh Xuan" ra mot duong o Da Nang).
mproute.nominatim.viewbox=105.28,21.39,106.05,20.53

